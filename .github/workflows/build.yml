name: Build

# Runs the tests of :org-core (the Org parser and writer) and of :app, and builds the release app,
# which it uploads as org-handheld.apk. The fixtures that the tests compare against come from
# tools/make-fixtures.el, which runs on a desktop w/ Emacs, not here.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Test org-core
        run: gradle :org-core:test --stacktrace

      # The Ubuntu runner carries an Android SDK; :app:test runs the walk's tests on the JVM. The
      # release APK is signed w/ the key kept in the repository (app/debug.keystore), so that each new
      # build installs over the old one.
      - name: Build and test app
        run: gradle :app:test :app:assembleRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk org-handheld.apk

      # archive: false uploads the file itself, so the artifact is org-handheld.apk.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: org-handheld.apk
          archive: false

      # The HTML and XML reports show which fixture a failing test compared.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            org-core/build/reports/tests
            org-core/build/test-results
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
