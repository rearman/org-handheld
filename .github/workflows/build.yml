name: Build

# Runs the tests of :org-core (the Org parser and writer) and of :app, and builds the debug app, which
# it uploads as org-handheld.apk, signed w/ the key of the repository's secrets. The fixtures that
# the tests compare against come from tools/make-fixtures.el, which runs on a desktop w/ Emacs, not
# here.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Test org-core
        run: gradle :org-core:test --stacktrace

      # The signing key of every APK (app/build.gradle.kts), from the repository's secrets, so that a
      # later run's APK updates an earlier install. W/o the secret the build keeps the debug key, and
      # no APK is uploaded.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORG_HANDHELD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/org-handheld.p12"
            echo "ORG_HANDHELD_KEYSTORE=$RUNNER_TEMP/org-handheld.p12" >> "$GITHUB_ENV"
          fi

      # The Ubuntu runner carries an Android SDK; :app:test runs the walk's tests on the JVM.
      - name: Build and test app
        env:
          ORG_HANDHELD_KEYSTORE_PASSWORD: ${{ secrets.ORG_HANDHELD_KEYSTORE_PASSWORD }}
        run: gradle :app:test :app:assembleDebug --stacktrace

      - name: Name the APK
        if: env.ORG_HANDHELD_KEYSTORE != ''
        run: cp app/build/outputs/apk/debug/app-debug.apk org-handheld.apk

      # One file, unzipped: the artifact is org-handheld.apk itself.
      - name: Upload APK
        if: env.ORG_HANDHELD_KEYSTORE != ''
        uses: actions/upload-artifact@v7
        with:
          path: org-handheld.apk
          archive: false

      # The HTML and XML reports show which fixture a failing test compared.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            org-core/build/reports/tests
            org-core/build/test-results
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
